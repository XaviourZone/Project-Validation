server:
  http_host: 127.0.0.1
  http_port: 8082
spool:
  input_dir: forwarder/spool/pending
  archive_dir: forwarder/spool/delivered
  failed_dir: forwarder/spool/failed
  state_db: forwarder/state/delivery
  secret_file: forwarder/state/forwarder_secrets.json
  poll_interval_seconds: 1
  claim_timeout_seconds: 300
retry:
  max_attempts: 5
  initial_delay_seconds: 2
  max_delay_seconds: 60
  multiplier: 2.0
destinations:
  D-DIODE-01:
    enabled: false
    protocol: sftp
    host: 127.0.0.1
    port: 22
    remote_path: /home/ddiode/txserver/in/
    username: ddiode
    private_key_file: ""
    connect_timeout_seconds: 10
    verify_remote_size: true
logging:
  level: INFO
