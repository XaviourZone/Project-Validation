<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Validation Console</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="eyebrow">VALIDATION</div>
      <h1>Operator Console</h1>
    </div>
    <div class="top-actions">
      <span id="clock">--:--:--</span>
      <button class="quiet" onclick="refresh()">REFRESH</button>
    </div>
  </header>

  <section class="services">
    <div class="service"><span>ROUTER</span><b id="router-state">--</b><button onclick="serviceAction('router','start')">START</button><button onclick="serviceAction('router','stop')">STOP</button></div>
    <div class="service"><span>PARSER</span><b id="parser-state">--</b><button onclick="serviceAction('parser','start')">START</button><button onclick="serviceAction('parser','stop')">STOP</button></div>
    <div class="service"><span>FORWARDER</span><b id="forwarder-state">--</b><button onclick="serviceAction('forwarder','start')">START</button><button onclick="serviceAction('forwarder','stop')">STOP</button></div>
    <div class="console-state"><span>CONSOLE</span><b>RUNNING</b></div>
  </section>

  <main>
    <section class="section">
      <div class="section-head">
        <div>
          <div class="eyebrow">REFERENCE DATA</div>
          <h2>WRS · PANS · NSC</h2>
          <p>Map the source once. Validate, then update the live RocksDB reference store.</p>
        </div>
      </div>
      <div id="references" class="reference-grid"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <div>
          <div class="eyebrow">DATA ROUTER</div>
          <h2>Input Sources</h2>
          <p id="router-summary">Loading…</p>
        </div>
      </div>
      <div id="sources" class="source-grid"></div>
    </section>

    <details class="diagnostics">
      <summary>Router diagnostics</summary>
      <pre id="router-status">Waiting…</pre>
    </details>
  </main>

  <footer><span id="message">Ready</span><span>Local · Offline capable</span></footer>
</div>
<script src="/static/app.js"></script>
</body>
</html>
