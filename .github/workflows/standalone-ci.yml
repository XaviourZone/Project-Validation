name: Standalone Validation CI

on:
  push:
    branches: ["dev/postgres-standalone-feeds"]
  pull_request:
    branches: ["dev/postgres-standalone-feeds"]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: validation
          POSTGRES_PASSWORD: validation
          POSTGRES_DB: validation
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U validation -d validation"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]>=3.2,<4" "Flask>=3,<4"
      - run: python -m py_compile standalone/db/*.py standalone/feeds/*.py standalone/offline/*.py
      - name: Apply PostgreSQL schema
        env:
          PGPASSWORD: validation
        run: psql -h 127.0.0.1 -U validation -d validation -f standalone/db/schema.sql
