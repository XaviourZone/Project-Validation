name: Build standalone four-service package

on:
  push:
    branches:
      - standalone/5050-four-service-package

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build ZIP
        run: python scripts/build_standalone_package.py
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: validation-standalone-5050
          path: validation-standalone-5050.zip
          if-no-files-found: error
          retention-days: 7
