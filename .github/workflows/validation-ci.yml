name: Validation CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install console dependency
        run: python -m pip install PyYAML
      - name: Python syntax
        run: python -m compileall -q console parser router forwarder shared migration
      - name: Shell syntax
        run: |
          bash -n scripts/start_all.sh
          bash -n scripts/start_validation.sh
      - name: JavaScript syntax
        run: node --check console/web/app.js
      - name: Configuration parse
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for p in [
              Path("router/config/sources.yaml"),
              Path("parser/config/parser.yaml"),
              Path("forwarder/config/forwarder.yaml"),
              Path("console/config/console.yaml"),
          ]:
              yaml.safe_load(p.read_text(encoding="utf-8"))
              print("OK", p)
          PY
